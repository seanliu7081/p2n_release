# @package _global_
defaults:
- /policy/p2n_state_gate_action_flow/sim
- /real_robot_task: nut_washer
- override /task/policy: real_robot/common_with_prev_window
- _self_
name: train_p2n_state_gate_action_flow_resnet18_real_robot
task_type: real_robot
state_history_keys:
- robot0_eef_pos
- robot0_eef_rot6d
- robot0_gripper_qpos
policy:
  rotation_6d_layout: rows
action_schema:
  control_frequency_hz: 30
  source: README.md; scripts/real_robot_tasks.py:ACTION_SEMANTICS
  translation:
    representation: delta_position
    frame: base
    units: metres
    integration: p_next = p_previous + dp
  rotation:
    representation: rotation_vector_delta
    frame: end_effector
    units: radians
    integration: R_next = R_previous @ Exp(drotvec)
  gripper:
    representation: absolute_command
    units: unitless
    open: 0.0
    closed: 1.0
  gripper_observation:
    representation: measured_width
    units: millimetres
  controller_postprocessing: external_controller_record_actual_sent_commands
training:
  num_demo: ${real_robot_task.num_demo}
  num_epochs: 2001
  checkpoint_every: 20
  snapshot_every: 20
  offline_validation_reason: held_out_${real_robot_task.dataset_name}_episodes
task:
  policy:
    lazy_eval: true
    env_runner: null
    dataset:
      _target_: src.dataset.action_flow_dataset.ActionFlowRealRobotZarrDatasetWithStateHistory
      state_history_steps: ${state_history_steps}
      state_history_keys: ${state_history_keys}
      history_padding: zero
      return_history_validity: true
      zarr_path: ${real_robot_task.dataset_path}
      val_ratio: ${real_robot_task.val_ratio}
      seed: ${real_robot_task.split_seed}
logging:
  project: real_robot_p2n_action_flow_resnet18
  group: ${variant}_resnet18_${real_robot_task.dataset_name}
