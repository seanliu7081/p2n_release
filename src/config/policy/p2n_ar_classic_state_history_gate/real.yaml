# @package _global_
defaults:
- /policy/p2n_ar_classic_state_history_gate/sim
- /real_robot_task: pen_cabinet_lp3
- override /task/policy: real_robot/common_with_prev_window
- _self_
name: train_p2n_ar_classic_state_history_gate_real_robot
state_history_keys:
- robot0_eef_pos
- robot0_eef_rot6d
- robot0_gripper_qpos
policy:
  _target_: src.policy.p2n_ar_classic_state_history_gate_real_robot.P2NARClassicRealRobotStateHistoryGatePolicy
  rotation_6d_layout: rows
  action_tokenizer:
    checkpoint: ${real_robot_task.oat_checkpoint}
training:
  num_demo: ${real_robot_task.num_demo}
  num_epochs: 2001
  val_every: 1
  checkpoint_every: 50
  snapshot_every: 0
  offline_validation_enabled: true
  offline_validation_reason: held_out_real_robot_episodes
dataloader:
  batch_size: 32
val_dataloader:
  batch_size: 32
task:
  policy:
    lazy_eval: true
    env_runner: null
    dataset:
      _target_: src.dataset.real_robot_state_history.RealRobotZarrDatasetWithStateHistory
      state_history_steps: ${state_history_steps}
      state_history_keys: ${state_history_keys}
      history_padding: zero
      return_history_validity: true
      zarr_path: ${real_robot_task.dataset_path}
      val_ratio: ${real_robot_task.val_ratio}
      seed: ${real_robot_task.split_seed}
logging:
  project: real_robot
  name: ${now:%Y%m%d.%H%M%S}_${name}_${policy.history_gate_mode}_seed${seed}
  group: ${real_robot_task.dataset_name}_gate
  tags:
  - ${name}
  - ${task_name}
  - state_history_gate
  - real_robot
  - ${policy.history_gate_mode}
checkpoint:
  save_all: true
  topk:
    monitor_key: val_loss
    mode: min
    k: 0
    format_str: ep-{epoch:04d}_val-{val_loss:.6f}.ckpt
  save_last_ckpt: false
  save_last_snapshot: false
