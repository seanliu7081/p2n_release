# @package _global_
defaults:
- /train_p2n_ar_modern
- /real_robot_task: nut_washer
- override /task/policy: real_robot/common_with_prev_window
- _self_
name: train_p2n_ar_modern_state_gate_real_robot
variant: p2n_ar_modern_state_gate
task_type: real_robot
state_history_steps: 8
state_history_keys:
- robot0_eef_pos
- robot0_eef_rot6d
- robot0_gripper_qpos
policy:
  _target_: src.policy.p2n_ar_modern.P2NARModernStateGatePolicy
  state_history_steps: ${state_history_steps}
  state_history_keys: ${state_history_keys}
  history_embed_dim: 128
  history_n_heads: 4
  history_n_layers: 2
  history_summary_tokens: 4
  history_dropout: 0.1
  history_gate_mode: learned
  history_gate_hidden_dim: 128
  history_gate_init: 0.9
  rotation_6d_layout: rows
  tokenizer_checkpoint: ${real_robot_task.oat_checkpoint}
task:
  policy:
    lazy_eval: true
    env_runner: null
    dataset:
      _target_: src.dataset.real_robot_state_history.RealRobotZarrDatasetWithStateHistory
      state_history_steps: ${state_history_steps}
      state_history_keys: ${state_history_keys}
      history_padding: zero
      return_history_validity: true
      zarr_path: ${real_robot_task.dataset_path}
      val_ratio: ${real_robot_task.val_ratio}
      seed: ${real_robot_task.split_seed}
training:
  num_demo: ${real_robot_task.num_demo}
  num_epochs: 2001
  checkpoint_every: 50
  snapshot_every: 50
  offline_validation_reason: held_out_${real_robot_task.dataset_name}_episodes
logging:
  project: real_robot_p2n_ar_modern
  group: ${variant}_resnet18_${real_robot_task.dataset_name}
