# @package _global_
# Standalone classic state-history gate recipe.
defaults:
- /task/policy: libero/libero10_with_prev_window
- _self_
name: train_p2n_ar_classic_state_history_gate
_target_: src.workspace.train_policy.TrainPolicyWorkspace
seed: 42
horizon: 16
n_action_steps: 8
n_obs_steps: 2
state_history_steps: 8
past_n: ${eval:'${state_history_steps}-1'}
state_history_keys:
- robot0_eef_pos
- robot0_eef_quat
- robot0_gripper_qpos
task_name: ${task.policy.name}
shape_meta: ${task.policy.shape_meta}
policy:
  _target_: src.policy.p2n_ar_classic_state_history_gate.P2NARClassicStateHistoryGatePolicy
  shape_meta: ${shape_meta}
  n_action_steps: ${n_action_steps}
  n_obs_steps: ${n_obs_steps}
  past_n: ${past_n}
  state_history_steps: ${state_history_steps}
  state_history_keys: ${state_history_keys}
  history_embed_dim: 128
  history_n_heads: 4
  history_n_layers: 2
  history_summary_tokens: 4
  history_dropout: 0.1
  obs_encoder:
    _target_: src.perception.fused_obs_encoder.FusedObservationEncoder
    _recursive_: false
    shape_meta: ${shape_meta}
    vision_encoder:
      _target_: src.perception.robomimic_vision_encoder.RobomimicRgbEncoder
      crop_shape:
      - 112
      - 112
      eval_fixed_crop: true
    state_encoder:
      _target_: src.perception.state_encoder.ProjectionStateEncoder
      out_dim: null
  action_tokenizer:
    _target_: src.tokenizer.oat.tokenizer.OATTok.from_checkpoint
    checkpoint: ???
  embed_dim: 256
  n_layers: 8
  n_heads: 8
  dropout: 0.1
  temperature: 0.0
  topk: 10
  self_past_p: 0.5
  self_past_warmup_steps: 1000
  self_past_temperature: 0.0
  self_past_topk: 10
  self_past_schedule: optimizer_step
  self_past_ramp_steps: 4000
  history_gate_mode: learned
  history_gate_hidden_dim: 128
  history_gate_init: 0.9
training:
  resume: false
  allow_bf16: true
  max_grad_norm: 1.0
  num_epochs: 2001
  val_every: 1
  sample_every: 1
  rollout_every: 100
  checkpoint_every: 25
  lr_scheduler: cosine
  lr_warmup_steps: 100
  gradient_accumulate_every: 1
  max_train_steps: null
  max_val_steps: null
  max_reconst_steps: 10
  seed: ${seed}
  use_ema: true
  num_demo: 500
  tqdm_interval_sec: 1.0
  init_checkpoint: null
  snapshot_every: 25
  validate_generated_history: true
ema:
  _target_: src.model.diffusion.ema_model.EMAModel
  update_after_step: 0
  inv_gamma: 1.0
  power: 0.75
  min_value: 0.0
  max_value: 0.9999
optimizer:
  policy_lr: 1.0e-05
  obs_enc_lr: 1.0e-05
  weight_decay: 0.0001
  betas:
  - 0.9
  - 0.95
dataloader:
  batch_size: 64
  num_workers: 4
  shuffle: true
  pin_memory: true
  persistent_workers: true
  drop_last: true
val_dataloader:
  batch_size: 64
  num_workers: 2
  shuffle: false
  pin_memory: true
  persistent_workers: true
  drop_last: false
task:
  policy:
    lazy_eval: true
    dataset:
      _target_: src.dataset.zarr_dataset_with_state_history.ZarrDatasetWithStateHistory
      state_history_steps: ${state_history_steps}
      state_history_keys: ${state_history_keys}
      history_padding: zero
      return_history_validity: true
    env_runner:
      _target_: src.env_runner.state_history_runner.LiberoStateHistoryRunner
      state_history_steps: ${state_history_steps}
      state_history_keys: ${state_history_keys}
      protocol: corrected
      n_test: 100
      n_test_vis: 0
      n_parallel_envs: 10
logging:
  project: oat_dev
  resume: false
  mode: offline
  name: ${now:%Y%m%d.%H%M%S}_${name}_${task_name}_N${training.num_demo}
  tags:
  - ${name}
  - ${task_name}
  - state_history_gate
  - ${policy.history_gate_mode}
  id: null
  group: null
checkpoint:
  topk:
    monitor_key: mean_success_rate
    mode: max
    k: 3
    format_str: ep-{epoch:04d}_sr-{mean_success_rate:.3f}.ckpt
  save_last_ckpt: true
  save_last_snapshot: false
multi_run:
  run_dir: output/${now:%Y%m%d}/${now:%H%M%S}_${name}_${task_name}_N${training.num_demo}
  wandb_name_base: ${now:%Y%m%d.%H%M%S}_${name}_${task_name}_N${training.num_demo}
hydra:
  job:
    override_dirname: ${name}
  run:
    dir: output/${now:%Y%m%d}/${now:%H%M%S}_${name}_${task_name}_N${training.num_demo}
  sweep:
    dir: output/${now:%Y%m%d}/${now:%H%M%S}_${name}_${task_name}_N${training.num_demo}
    subdir: ${hydra.job.num}
